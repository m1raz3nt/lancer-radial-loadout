name: Release Module

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Foundry сверяет обновления с манифестом на main, а CI берёт версию из
      # тега. Если они разъезжаются, у пользователей появляется вечно доступное
      # обновление, которое ставит ту же версию. Ловим это до сборки.
      - name: Тег должен совпадать с version в module.json
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          COMMITTED="$(jq -r '.version' module.json)"
          if [ "$COMMITTED" != "$VERSION" ]; then
            echo "::error::Тег $TAG даёт версию $VERSION, а в module.json записана $COMMITTED."
            exit 1
          fi

      - name: Inject version and URLs into module.json
        env:
          TAG: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          URL="https://github.com/${REPO}"
          # Проверка обновлений идёт по манифесту на main, а не по releases/latest:
          # часть релизов помечена pre-release, а GitHub исключает такие из latest.
          MANIFEST="https://raw.githubusercontent.com/${REPO}/refs/heads/main/module.json"
          DOWNLOAD="https://github.com/${REPO}/releases/download/${TAG}/module.zip"
          tmp="$(mktemp)"
          jq --arg v "$VERSION" --arg u "$URL" --arg m "$MANIFEST" --arg d "$DOWNLOAD" \
            '.version = $v | .url = $u | .manifest = $m | .download = $d' module.json > "$tmp"
          mv "$tmp" module.json
          echo "--- module.json ---"
          cat module.json

      - name: Build module.zip (module.json at archive root)
        run: |
          set -euo pipefail
          files="module.json scripts styles"
          for extra in lang README.md LICENSE; do
            if [ -e "$extra" ]; then files="$files $extra"; fi
          done
          zip -r module.zip $files

      - name: Attach module.json and module.zip to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            module.json
            module.zip
